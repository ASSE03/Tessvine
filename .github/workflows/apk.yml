name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compiler
        run: gradle --no-daemon :app:assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Tessvine-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tessvine-${{ github.run_number }}
          path: Tessvine-${{ github.run_number }}.apk

      - name: Publier la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "Tessvine-${{ github.run_number }}.apk" \
            --title "Tessvine 1.0.${{ github.run_number }}" \
            --notes "$NOTES" --latest
